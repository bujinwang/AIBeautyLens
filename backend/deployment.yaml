apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibeautylens-backend-deployment
  labels:
    app: aibeautylens-backend
spec:
  replicas: 1 # Start with 1 replica, can be scaled later
  selector:
    matchLabels:
      app: aibeautylens-backend
  template:
    metadata:
      labels:
        app: aibeautylens-backend
    spec:
      serviceAccountName: aibeautylens-k8s-sa
      containers:
      - name: aibeautylens-backend
        image: gcr.io/shining-env-459701-v5/aibeautylens-backend:latest-direct-sign-amd64
        imagePullPolicy: Always
        ports:
        - containerPort: 3000 # Port your NestJS app listens on
        env:
        - name: GCS_BUCKET_NAME
          value: "aimeifuphotobucket"
        - name: GCS_PROJECT_ID
          value: "shining-env-459701-v5"
        - name: GCS_SIGNING_SERVICE_ACCOUNT_EMAIL
          value: "aibeautylens-sa@shining-env-459701-v5.iam.gserviceaccount.com"
        - name: PORT
          value: "3000"
        # You will need to create a .env file or manage secrets in GKE for sensitive data
        # For now, we'll assume environment variables are set directly or via ConfigMaps/Secrets
        # For GCS_SIGNING_SERVICE_ACCOUNT_EMAIL, ensure it's correctly configured.
        # The GKE node service account will be used by default if the application code
        # relies on Application Default Credentials (ADC) within the GKE pod.
        # This node service account needs the 'Service Account Token Creator' role
        # on the 'GCS_SIGNING_SERVICE_ACCOUNT_EMAIL' if that's how you've configured your gcs.service.ts
        # Alternatively, you can assign the 'GCS_SIGNING_SERVICE_ACCOUNT_EMAIL' directly to the GKE nodes.
        # For simplicity, ensure the GKE default node service account has the necessary permissions.
        # Or, create a dedicated service account for the GKE nodes and grant it permissions.
